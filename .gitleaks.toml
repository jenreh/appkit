title = "appkit gitleaks config"

[extend]
useDefault = true

# Lockfile hashes and generated trees are never hand-written secrets.
[[allowlists]]
description = "Lockfiles and generated or vendored trees"
paths = [
    '''(^|/)uv\.lock$''',
    '''(^|/)\.venv(\.mac)?/''',
    '''(^|/)\.web/''',
    '''(^|/)node_modules/''',
]

# Config values like `password: secret:mn-db-password` name a secret in the secret provider,
# they never contain one. Only the whole kebab-case reference is ignored, so a real value
# that merely contains "secret:" is still reported.
[[allowlists]]
description = "References to the secret provider, which hold no secret value"
regexes = ['''^secret:[a-z0-9]+(-[a-z0-9]+)*$''']

# Already in git history, cannot be removed without rewriting it.
[[allowlists]]
description = "Removed detect-secrets baseline"
targetRules = ["generic-api-key"]
paths = ['''^\.secrets\.baseline$''']

# A fixed row id in a migration is flagged as an API key.
[[allowlists]]
description = "Default admin id in alembic migration"
targetRules = ["generic-api-key"]
paths = ['''^alembic/versions/2025_02_12_99a9644dc419_default_admin\.py$''']
