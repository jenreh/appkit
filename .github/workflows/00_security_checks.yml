name: 00 Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml

  dependencies:
    name: Audit locked dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"

      - name: Export the lockfile
        run: uv export --frozen --no-hashes --no-emit-workspace --all-extras -o requirements.audit.txt

      # PYSEC-2026-282 (apscheduler deserialization RCE) has no fixed release. It
      # needs write access to the APScheduler data store; the demo app schedules
      # with PGQueuer. Drop the ignore once a fixed apscheduler ships.
      - name: Run pip-audit
        run: >
          uvx pip-audit --requirement requirements.audit.txt --no-deps --disable-pip
          --ignore-vuln PYSEC-2026-282
