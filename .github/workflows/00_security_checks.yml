name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Betterleaks ships no official action, so install the pinned release binary.
      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: "1.9.0"
          BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$archive"
          echo "$BETTERLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run betterleaks
        run: betterleaks git . --no-banner --redact --verbose

  python:
    name: uv audit (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      # PYSEC-2026-282 (apscheduler deserialization RCE) has no fixed release. It
      # needs write access to the APScheduler data store; the demo app schedules
      # with PGQueuer. Drop the ignore once a fixed apscheduler ships.
      - name: Audit uv.lock against known vulnerabilities
        run: uv audit --frozen --ignore PYSEC-2026-282
