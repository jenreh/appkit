profile: production

reflex:
  deploy_url: secret:mn-server-endpoint
  api_url: secret:mn-server-endpoint
  frontend_port: 8080
  backend_port: 3030
  workers: 2
  single_port: true

app:
  environment: production

  authentication:
    server_url: secret:mn-server-endpoint
    server_port: 80
    # Deployment is TLS-terminated: never let the session cookie travel or be
    # set over plaintext http.
    session_cookie_secure: true

    oauth_providers:
      - provider: "github"
        client_id: secret:mn-oauth-github-client-id
        client_secret: secret:mn-oauth-github-client-secret
        redirect_url: secret:mn-oauth-endpoint

  mcp_image:
    default_model: "nano-banana-2"
